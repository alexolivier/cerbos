---
apiVersion: api.cerbos.dev/v1
description: Checks that an approval token issued by Cerbos Hub matches the request being evaluated
exportVariables:
  name: cerbos_hub_approval
  definitions:
    approved: |-
      has(request.auxData.jwts.approval) &&
      has(request.auxData.jwts.approval.claims.iss) &&
      has(request.auxData.jwts.approval.claims.aud) &&
      has(request.auxData.jwts.approval.claims.principal_id) &&
      has(request.auxData.jwts.approval.claims.resource) &&
      has(request.auxData.jwts.approval.claims.action) &&
      request.auxData.jwts.approval.claims.iss == "cerbos-hub" &&
      "EXAMPLEWSEID" in request.auxData.jwts.approval.claims.aud &&
      request.auxData.jwts.approval.claims.principal_id == P.id &&
      request.auxData.jwts.approval.claims.resource.kind == R.kind &&
      request.auxData.jwts.approval.claims.resource.id == R.id
    approved_action: |-
      has(request.auxData.jwts.approval) &&
      has(request.auxData.jwts.approval.claims.action)
        ? request.auxData.jwts.approval.claims.action
        : ""
